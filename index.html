<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Aos 64 anos, um ano depois de operar um câncer de próstata, corri 64 km. Agora vem a primeira maratona. Run with Gratitude.">
<meta property="og:title" content="Run with Gratitude">
<meta property="og:description" content="64 anos. 64 km. E agora a primeira maratona.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://runwithgratitude.ca">
<title>Run with Gratitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e100f; --bg2:#161917; --linha:#242825;
  --tx:#eceee9; --tx2:#a3a9a1; --tx3:#6f766d;
  --acc:#c9a227; --acc2:#7fa650;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:660px;margin:0 auto;padding:0 22px}
a{color:inherit}

header{border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:10;
  background:rgba(14,16,15,.88);backdrop-filter:blur(12px)}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.marca{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em;
  text-decoration:none;flex:1}
.marca i{color:var(--acc);font-style:normal}
.idioma{display:flex;border:1px solid var(--linha);border-radius:20px;overflow:hidden}
.idioma button{background:none;border:0;color:var(--tx3);font-family:var(--sans);
  font-size:11.5px;font-weight:600;padding:6px 12px;cursor:pointer;letter-spacing:.04em}
.idioma button.on{background:var(--acc);color:#161917}

.ham{background:none;border:1px solid var(--linha);border-radius:9px;width:34px;height:31px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  cursor:pointer;padding:0;flex:none}
.ham i{display:block;width:16px;height:1.6px;background:var(--tx2);border-radius:1px}
.ham:hover{border-color:var(--acc)} .ham:hover i{background:var(--acc)}

.veu{position:fixed;inset:0;background:rgba(8,9,8,.72);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .22s}
.veu.on{opacity:1;pointer-events:auto}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);z-index:41;
  background:var(--bg2);border-left:1px solid var(--linha);transform:translateX(100%);
  transition:transform .24s ease;overflow-y:auto;padding:20px 18px 40px}
#menu.on{transform:none}
#menu .cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#menu .cab b{flex:1;font-family:var(--serif);font-size:15px;font-weight:600}
#menu .cab button{background:none;border:0;color:var(--tx3);font-size:22px;cursor:pointer;
  line-height:1;padding:0 4px}
#menu a{display:block;text-decoration:none;padding:11px 0;border-bottom:1px solid var(--linha)}
#menu a:last-child{border-bottom:0}
#menu a .d{display:block;font-size:11px;color:var(--tx3);letter-spacing:.06em;font-weight:600;
  font-variant-numeric:tabular-nums;margin-bottom:3px}
#menu a .t{display:block;font-size:14.5px;color:var(--tx);line-height:1.35}
#menu a:hover .t{color:var(--acc)}
#menu a.aqui .t{color:var(--acc)}
#menu a.aqui .d{color:var(--acc)}
#menu .nada{color:var(--tx3);font-size:13.5px;font-style:italic;padding:12px 0}

#versiculo{border-top:1px solid var(--linha);padding:26px 0 28px}
#versiculo p{font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:clamp(16px,3.6vw,19px);line-height:1.6;color:var(--tx);margin:0 0 10px;
  max-width:46ch}
#versiculo cite{font-style:normal;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--acc)}
#versiculo small{display:block;margin-top:9px;font-size:10.5px;color:var(--tx3);letter-spacing:.03em}

.hero{padding:52px 0 40px;border-bottom:1px solid var(--linha)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,7vw,46px);
  line-height:1.15;margin:0 0 18px;letter-spacing:-.02em}
.hero h1 b{font-weight:600;color:var(--acc)}
.hero p{color:var(--tx2);font-size:16px;margin:0 0 26px;max-width:52ch}
.conta{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--linha)}
.conta b{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--acc2);line-height:1}
.conta span{font-size:13px;color:var(--tx2);line-height:1.45}

main{padding:38px 0 60px}
.vazio{color:var(--tx3);font-size:15px;text-align:center;padding:60px 0;font-style:italic}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:6px 0 10px}
.grade a{display:block;text-decoration:none;color:inherit;border-radius:12px;overflow:hidden;
  background:var(--bg2);border:1px solid var(--linha)}
.grade .capa{aspect-ratio:4/3;background:var(--bg2);overflow:hidden}
.grade .capa img{width:100%;height:100%;object-fit:cover;display:block}
.grade .capa.sem{display:flex;align-items:center;justify-content:center}
.grade .capa.sem b{font-family:var(--serif);font-style:italic;font-weight:300;font-size:26px;color:var(--tx3)}
.grade .txt{padding:9px 11px 12px}
.grade .txt .d{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)}
.grade .txt .t{display:block;margin-top:3px;font-size:14px;line-height:1.35}
.grade .txt .k{display:block;margin-top:5px;font-size:11.5px;color:var(--tx3)}
@media(min-width:720px){.grade{grid-template-columns:1fr 1fr 1fr}}
article{padding:30px 0;border-bottom:1px solid var(--linha)}
article:last-child{border-bottom:0}
.data{font-size:11.5px;color:var(--tx3);letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;margin-bottom:9px}
article h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.25;
  margin:0 0 10px;letter-spacing:-.01em}
.corpo{color:var(--tx2);font-size:16.5px;line-height:1.75}
.corpo p{margin:0 0 15px}
.corpo p:last-child{margin-bottom:0}
.corpo b{color:var(--tx);font-weight:600}
.resumo{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.resumo span{font-size:11.5px;color:var(--tx2);background:var(--bg2);
  border:1px solid var(--linha);border-radius:20px;padding:4px 11px;font-variant-numeric:tabular-nums}
#evo{padding:30px 0;border-bottom:1px solid var(--linha)}
#evo .desde{font-size:12px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;
  font-weight:600;margin-bottom:14px}
.esp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.esp div{background:var(--bg2);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.esp img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--bg3)}
.esp .n{padding:13px 13px 15px}
.esp b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--acc2);
  line-height:1.1;font-variant-numeric:tabular-nums}
.esp u{display:block;text-decoration:none;font-size:12px;color:var(--tx2);margin-top:3px;
  font-variant-numeric:tabular-nums}
.esp span{display:block;font-size:11px;color:var(--tx3);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin-top:8px}
@media(max-width:420px){.esp b{font-size:19px}.esp .n{padding:10px}.esp span{font-size:10px}}
.midia{margin:16px 0 4px;display:grid;gap:9px}
.midia img{width:100%;border-radius:11px;display:block;background:var(--bg2);cursor:zoom-in}
.midia .duas{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.video{position:relative;width:100%;padding-top:56.25%;border-radius:11px;overflow:hidden;
  background:var(--bg2);margin:16px 0 4px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lupa{position:fixed;inset:0;background:rgba(8,9,8,.94);z-index:99;display:none;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lupa.on{display:flex}
.lupa img{max-width:100%;max-height:100%;border-radius:8px}
.mais{background:none;border:0;color:var(--acc);font-family:var(--sans);font-size:13.5px;
  font-weight:600;cursor:pointer;padding:8px 0;margin-top:6px}
.voltar{position:sticky;top:60px;z-index:9;display:block;width:100%;text-align:left;
  background:var(--bg2);border:1px solid var(--linha);border-radius:10px;color:var(--acc);
  font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;padding:11px 14px;
  margin-bottom:18px;backdrop-filter:blur(10px)}
.voltar:hover{border-color:var(--acc)}
#menu .inicio{color:var(--acc);font-weight:600;font-size:14px;padding:12px 0;
  border-bottom:1px solid var(--linha);cursor:pointer;background:none;border-left:0;
  border-right:0;border-top:0;width:100%;text-align:left;font-family:var(--sans)}
footer{border-top:1px solid var(--linha);padding:30px 0 46px;color:var(--tx3);font-size:12.5px}
footer p{margin:0 0 8px}
footer .canal{display:inline-flex;align-items:center;gap:7px;color:var(--tx2);
  text-decoration:none;border:1px solid var(--linha);border-radius:999px;
  padding:7px 14px;margin:2px 0 12px;font-size:12.5px;transition:border-color .2s}
footer .canal:hover{border-color:var(--tx3)}
footer .canal svg{width:16px;height:16px;flex:none}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="marca" href="/" id="btMarca">Run with <i>Gratitude</i></a>
  <div class="idioma">
    <button data-l="pt" class="on">PT</button><button data-l="en">EN</button>
  </div>
  <button class="ham" id="btMenu" aria-label="Menu"><i></i><i></i><i></i></button>
</div></header>

<div class="veu" id="veu"></div>
<nav id="menu">
  <div class="cab"><b id="mTit"></b><button id="mFecha" aria-label="Fechar">×</button></div>
  <div id="mLista"></div>
</nav>

<section class="hero"><div class="wrap">
  <h1 id="hTit"></h1>
  <p id="hSub"></p>
  <div class="conta"><b id="cDias">—</b><span id="cTxt"></span></div>
</div></section>

<section id="evo" style="display:none"><div class="wrap" id="evoIn"></div></section>

<section id="versiculo"><div class="wrap">
  <p id="vTxt"></p><cite id="vRef"></cite><small id="vVer"></small>
</div></section>

<main><div class="wrap" id="posts"></div></main>
<div class="lupa" id="lupa"><img alt=""></div>

<footer><div class="wrap">
  <a class="canal" id="fCanal" href="https://www.youtube.com/@runwithgratitude_luiz" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 12s0-3.8-.5-5.6a2.9 2.9 0 0 0-2-2C18.7 4 12 4 12 4s-6.7 0-8.5.4a2.9 2.9 0 0 0-2 2C1 8.2 1 12 1 12s0 3.8.5 5.6a2.9 2.9 0 0 0 2 2C5.3 20 12 20 12 20s6.7 0 8.5-.4a2.9 2.9 0 0 0 2-2C23 15.8 23 12 23 12zM9.8 15.4V8.6l5.8 3.4-5.8 3.4z"/></svg>
    <span id="fCanalT"></span>
  </a>
  <p id="fTxt"></p>
  <p>© <span id="ano"></span> Luiz Silva · Saint John, New Brunswick</p>
</div></footer>

<script>
const DB   = 'https://gastos-casa-7f431-default-rtdb.firebaseio.com';
const PROVA = '2026-10-18';

const T = {
  pt:{
    evoD:'Desde 13 de junho de 2025',
    eCorrida:'corrida', eBike:'bike', eNat:'natação',
    tit:'Aos 64 anos, correndo com <b>gratidão</b>.',
    sub:'Em junho de 2025 operei um câncer de próstata. Um ano depois, no mesmo dia, corri 64 km — um para cada ano de vida. Agora vem a primeira maratona da minha vida, e um índice para Boston.',
    ctxt:'dias para a PEI Marathon,<br>18 de outubro de 2026',
    hoje:'É hoje. PEI Marathon.',
    passou:'A PEI Marathon já passou.',
    vazio:'Os primeiros textos chegam em breve.',
    mais:'Continuar lendo',
    menos:'Recolher',
    menuT:'Publicações',
    menuV:'Nada publicado ainda.',
    escolha:'Toque no menu, no alto à direita, para ler os textos.',
    voltar:'← Voltar ao início',
    canal:'Acompanhe no YouTube',
    rodape:'Um diário de treino e de vida, escrito no caminho até 18 de outubro.'
  },
  en:{
    evoD:'Since June 13, 2025',
    eCorrida:'running', eBike:'cycling', eNat:'swimming',
    tit:'At 64, running with <b>gratitude</b>.',
    sub:'In June 2025 I had surgery for prostate cancer. One year later, to the day, I ran 64 km — one for every year of my life. Now comes the first marathon of my life, and a Boston qualifying time.',
    ctxt:'days to the PEI Marathon,<br>October 18, 2026',
    hoje:'Today is the day. PEI Marathon.',
    passou:'The PEI Marathon has passed.',
    vazio:'The first posts are coming soon.',
    mais:'Keep reading',
    menos:'Collapse',
    menuT:'Posts',
    menuV:'Nothing published yet.',
    escolha:'Tap the menu, top right, to read the posts.',
    voltar:'← Back to the top',
    canal:'Follow on YouTube',
    rodape:'A training and life journal, written on the way to October 18.'
  }
};
const MES = {
  pt:['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],
  en:['January','February','March','April','May','June','July','August','September','October','November','December']
};

let idioma = (localStorage.getItem('rwg.lang')
  || (navigator.language||'pt').slice(0,2).toLowerCase());
if(idioma !== 'en') idioma = 'pt';
let POSTS = [];
let escolhido = null;          /* qual texto está na tela; o menu manda */
const abertos = new Set();

const esc = t => String(t==null?'':t)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* parágrafos por linha em branco, **negrito** por asteriscos duplos */
function texto(t){
  return esc(t).trim().split(/\n\s*\n/)
    .map(p => '<p>' + p.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>') + '</p>')
    .join('');
}
function dataLonga(iso){
  const d = new Date(iso + 'T12:00:00');
  return idioma === 'pt'
    ? d.getDate() + ' de ' + MES.pt[d.getMonth()] + ' de ' + d.getFullYear()
    : MES.en[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

/* Traduções de domínio público: Almeida em português, King James em
   inglês. Traduções modernas como NVI e NIV têm direitos e não podem
   ser reproduzidas assim.

   Troca por DIA, não a cada visita: um versículo que muda enquanto
   você lê vira ruído, e assim ele acompanha o seu dia. */
const VERSICULOS = [
 {r:['Salmos 107:1','Psalm 107:1'],
  pt:'Louvai ao Senhor, porque ele é bom, porque a sua benignidade dura para sempre.',
  en:'O give thanks unto the LORD, for he is good: for his mercy endureth for ever.'},
 {r:['Isaías 40:31','Isaiah 40:31'],
  pt:'Mas os que esperam no Senhor renovarão as suas forças; subirão com asas como águias; correrão, e não se cansarão; caminharão, e não se fatigarão.',
  en:'But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.'},
 {r:['1 Tessalonicenses 5:18','1 Thessalonians 5:18'],
  pt:'Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para convosco.',
  en:'In every thing give thanks: for this is the will of God in Christ Jesus concerning you.'},
 {r:['Salmos 103:2','Psalm 103:2'],
  pt:'Bendize, ó minha alma, ao Senhor, e não te esqueças de nenhum de seus benefícios.',
  en:'Bless the LORD, O my soul, and forget not all his benefits.'},
 {r:['Hebreus 12:1','Hebrews 12:1'],
  pt:'Corramos com paciência a carreira que nos está proposta.',
  en:'Let us run with patience the race that is set before us.'},
 {r:['Salmos 118:24','Psalm 118:24'],
  pt:'Este é o dia que fez o Senhor; regozijemo-nos, e alegremo-nos nele.',
  en:'This is the day which the LORD hath made; we will rejoice and be glad in it.'},
 {r:['Salmos 28:7','Psalm 28:7'],
  pt:'O Senhor é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido.',
  en:'The LORD is my strength and my shield; my heart trusted in him, and I am helped.'},
 {r:['Colossenses 3:17','Colossians 3:17'],
  pt:'E, quanto fizerdes por palavras ou por obras, fazei tudo em nome do Senhor Jesus, dando por ele graças a Deus.',
  en:'And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.'},
 {r:['Filipenses 4:6','Philippians 4:6'],
  pt:'Não estejais inquietos por coisa alguma; antes as vossas petições sejam em tudo conhecidas diante de Deus, pela oração e súplica, com ação de graças.',
  en:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.'},
 {r:['1 Coríntios 9:24','1 Corinthians 9:24'],
  pt:'Correi de tal maneira que o alcanceis.',
  en:'So run, that ye may obtain.'},
 {r:['Salmos 100:4','Psalm 100:4'],
  pt:'Entrai pelas suas portas com gratidão, e em seus átrios com louvor; louvai-o, e bendizei o seu nome.',
  en:'Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.'},
 {r:['2 Coríntios 9:15','2 Corinthians 9:15'],
  pt:'Graças a Deus pelo seu dom inefável.',
  en:'Thanks be unto God for his unspeakable gift.'}
];

function pintarVersiculo(){
  const dia = Math.floor(Date.now() / 864e5);
  const v = VERSICULOS[dia % VERSICULOS.length];
  document.getElementById('vTxt').textContent = idioma === 'en' ? v.en : v.pt;
  document.getElementById('vRef').textContent = idioma === 'en' ? v.r[1] : v.r[0];
  document.getElementById('vVer').textContent = idioma === 'en'
    ? 'King James Version' : 'Almeida';
}

let EVO = null;

function pintarEvolucao(){
  if(!EVO || !EVO.corrida) return;
  const t = T[idioma];
  const nf = idioma === 'pt' ? 'pt-BR' : 'en-CA';
  const cartao = function(d, rotulo, foto){
    if(!d) return '';
    /* abaixo de 10 km um decimal importa: a natação soma pouco e
       arredondar apagaria a informação */
    const km = d.km || 0;
    return '<div><img src="' + foto + '" alt="" loading="lazy"><div class="n"><b>' + km.toLocaleString(nf, {minimumFractionDigits: km < 10 ? 1 : 0,
                                               maximumFractionDigits: km < 10 ? 1 : 0}) + '</b>'
         + '<u>km · ' + (d.n || 0) + '</u>'
         + '<span>' + rotulo + '</span></div></div>';
  };
  document.getElementById('evoIn').innerHTML =
      '<div class="desde">' + t.evoD + '</div>'
    + '<div class="esp">'
    +   cartao(EVO.corrida, t.eCorrida, './foto-corrida.jpg')
    +   cartao(EVO.bike,    t.eBike,    './foto-bike.jpg')
    +   cartao(EVO.natacao, t.eNat,     './foto-natacao.jpg')
    + '</div>';
  document.getElementById('evo').style.display = 'block';
}

/* YouTube e Vimeo por link colado; qualquer outro endereço vira link simples */
function embutir(url){
  if(!url) return '';
  const u = String(url).trim();
  let id = '', src = '';
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if(m){ id = m[1]; src = 'https://www.youtube-nocookie.com/embed/' + id }
  if(!src){ m = u.match(/vimeo\.com\/(\d+)/); if(m) src = 'https://player.vimeo.com/video/' + m[1] }
  if(!src) return '<p style="margin:14px 0 0"><a href="' + esc(u) + '" style="color:var(--acc)">'
                + esc(u) + '</a></p>';
  return '<div class="video"><iframe src="' + src + '" loading="lazy" allowfullscreen '
       + 'referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
}

/* As fotos ficam num nó à parte e só descem quando o texto aparece na tela.
   Se viessem junto com a lista, a página inicial pesaria megabytes. */
const fotosVistas = {};
function carregarFotos(){
  document.querySelectorAll('.midia[data-fotos]').forEach(function(el){
    const id = el.dataset.fotos;
    if(fotosVistas[id]){ pintarFotos(el, fotosVistas[id]); return }
    if(el.dataset.indo) return;
    el.dataset.indo = '1';
    fetch(DB + '/blog/midia/' + id + '.json')
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(d){
        const arr = d ? (Array.isArray(d) ? d : Object.keys(d).sort().map(function(k){ return d[k] })) : [];
        fotosVistas[id] = arr; pintarFotos(el, arr);
      })
      .catch(function(){});
  });
}
function pintarFotos(el, arr){
  if(!arr || !arr.length){ el.remove ? el.remove() : (el.innerHTML = '') ; return }
  const html = arr.map(function(src){ return '<img src="' + src + '" alt="" loading="lazy">' }).join('');
  el.innerHTML = arr.length === 2 ? '<div class="duas">' + html + '</div>' : html;
  el.querySelectorAll('img').forEach(function(im){
    im.onclick = function(){
      const l = document.getElementById('lupa');
      l.querySelector('img').src = im.src; l.classList.add('on');
    };
  });
}

/* GRADE DA TELA INICIAL
   Antes daqui a página abria pedindo para tocar no menu das tres listinhas.
   Os textos existiam, as fotos tambem, mas ficavam escondidos. Agora a
   capa de cada texto aparece logo abaixo do versiculo.

   So os 9 mais recentes entram, e de cada um desce apenas a PRIMEIRA foto.
   O resto continua chegando quando o texto e aberto, como sempre foi. */
const GRADE_N = 9;
const capasVistas = {};

function montarGrade(){
  const t = T[idioma];
  const UN = {corrida:' km', bike:' km', natacao:' m'};
  return '<div class="grade">' + POSTS.slice(0, GRADE_N).map(function(p){
    const tit = (idioma === 'en' ? p.t_en : p.t_pt) || p.t_pt || p.t_en || '—';
    const km  = p.km ? esc(p.km) + (UN[p.esporte] || ' km') : '';
    return '<a href="#p-' + p.id + '" data-ir="' + p.id + '">'
      + '<div class="capa sem" data-capa="' + p.id + '"><b>RG</b></div>'
      + '<div class="txt"><span class="d">' + curta(p.data) + '</span>'
      + '<span class="t">' + esc(tit) + '</span>'
      + (km ? '<span class="k">' + km + '</span>' : '')
      + '</div></a>';
  }).join('') + '</div>';
}

function ligarGrade(){
  document.querySelectorAll('.grade [data-ir]').forEach(function(a){
    a.onclick = function(e){
      e.preventDefault();
      escolhido = a.dataset.ir;
      abertos.clear();
      pintar();
      setTimeout(function(){
        const m = document.querySelector('main');
        if(m) m.scrollIntoView({behavior:'smooth', block:'start'});
      }, 180);
    };
  });
}

function carregarCapas(){
  document.querySelectorAll('.capa[data-capa]').forEach(function(el){
    const id = el.dataset.capa;
    if(capasVistas[id] !== undefined){ pintarCapa(el, capasVistas[id]); return }
    if(fotosVistas[id]){ capasVistas[id] = fotosVistas[id][0] || null; pintarCapa(el, capasVistas[id]); return }
    if(el.dataset.indo) return;
    el.dataset.indo = '1';
    fetch(DB + '/blog/midia/' + id + '.json')
      .then(function(r){ return r.ok ? r.json() : null })
      .then(function(d){
        const arr = d ? (Array.isArray(d) ? d : Object.keys(d).sort().map(function(k){ return d[k] })) : [];
        fotosVistas[id] = arr;
        capasVistas[id] = arr[0] || null;
        pintarCapa(el, capasVistas[id]);
      })
      .catch(function(){ capasVistas[id] = null });
  });
}

function pintarCapa(el, src){
  if(!src) return;                       /* texto sem foto fica com as iniciais */
  el.classList.remove('sem');
  el.innerHTML = '<img src="' + src + '" alt="" loading="lazy">';
}

/* Índice de tudo que já foi publicado, por data e título. Cresce
   sozinho: cada texto novo entra aqui sem eu tocar em nada. */
function curta(iso){
  const d = new Date(iso + 'T12:00:00');
  const p = n => String(n).padStart(2,'0');
  return idioma === 'pt'
    ? p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear()
    : p(d.getMonth()+1) + '/' + p(d.getDate()) + '/' + d.getFullYear();
}
function montarMenu(){
  const t = T[idioma];
  document.getElementById('mTit').textContent = t.menuT;
  const el = document.getElementById('mLista');
  if(!POSTS.length){ el.innerHTML = '<div class="nada">' + t.menuV + '</div>'; return }
  const topo = escolhido
    ? '<button class="inicio" id="mInicio">' + t.voltar + '</button>' : '';
  el.innerHTML = topo + POSTS.map(function(p){
    const tit = (idioma === 'en' ? p.t_en : p.t_pt) || p.t_pt || p.t_en || '—';
    return '<a href="#p-' + p.id + '" data-ir="' + p.id + '"'
         + (p.id === escolhido ? ' class="aqui"' : '') + '>'
         + '<span class="d">' + curta(p.data) + '</span>'
         + '<span class="t">' + esc(tit) + '</span></a>';
  }).join('');
  const mi = document.getElementById('mInicio');
  if(mi) mi.onclick = function(){ abrirMenu(false); aoInicio() };

  el.querySelectorAll('[data-ir]').forEach(function(a){
    a.onclick = function(e){
      e.preventDefault();
      abrirMenu(false);
      escolhido = a.dataset.ir;
      abertos.clear();
      pintar();
      setTimeout(function(){
        const m = document.querySelector('main');
        if(m) m.scrollIntoView({behavior:'smooth', block:'start'});
      }, 180);
    };
  });
}
/* Volta para a tela limpa de onde você estiver: pelo botão no alto do
   texto, pelo menu, pelo fim do texto ou tocando no nome do site. */
function aoInicio(){
  escolhido = null;
  abertos.clear();
  pintar();
  window.scrollTo({top:0, behavior:'smooth'});
}

function abrirMenu(sim){
  document.getElementById('menu').classList.toggle('on', sim);
  document.getElementById('veu').classList.toggle('on', sim);
}

function contagem(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const alvo = new Date(PROVA + 'T00:00:00');
  const d = Math.round((alvo - hoje) / 864e5);
  const t = T[idioma];
  if(d > 0){ document.getElementById('cDias').textContent = d;
             document.getElementById('cTxt').innerHTML = t.ctxt }
  else { document.getElementById('cDias').textContent = d === 0 ? '0' : '—';
         document.getElementById('cTxt').innerHTML = d === 0 ? t.hoje : t.passou }
}

function pintar(){
  const t = T[idioma];
  document.documentElement.lang = idioma;
  document.getElementById('hTit').innerHTML = t.tit;
  document.getElementById('hSub').textContent = t.sub;
  document.getElementById('fCanalT').textContent = t.canal;
  document.getElementById('fTxt').textContent = t.rodape;
  document.getElementById('ano').textContent = new Date().getFullYear();
  contagem();

  pintarVersiculo();
  pintarEvolucao();

  /* A tela principal é só a história e os números. Texto nenhum
     aparece aqui até você escolher um no menu das três listinhas.

     O menu é montado ANTES de qualquer saída antecipada: ele existe
     mesmo quando não há texto escolhido — aliás, é justamente aí que
     ele é a única porta para os textos. */
  montarMenu();
  const host = document.getElementById('posts');
  if(!escolhido){
    host.innerHTML = POSTS.length
      ? montarGrade()
      : '<div class="vazio">' + t.vazio + '</div>';
    if(POSTS.length){ ligarGrade(); carregarCapas() }
    return;
  }

  /* Um texto por vez. A tela principal abre no mais recente e o menu
     das três listinhas serve de índice para os outros — foi assim que
     ele pediu, e evita a página virar um rolo sem fim. */
  const atual = POSTS.find(function(p){ return p.id === escolhido });
  if(!atual){ escolhido = null; host.innerHTML = ''; return }
  host.innerHTML = '<button class="voltar" id="btTopo">' + t.voltar + '</button>'
    + [atual].map(function(p){
    const tit = (idioma === 'en' ? p.t_en : p.t_pt) || p.t_pt || p.t_en || '';
    const cor = (idioma === 'en' ? p.c_en : p.c_pt) || p.c_pt || p.c_en || '';
    const longo = cor.length > 620;
    const aberto = abertos.has(p.id) || !longo;
    const mostra = aberto ? cor : cor.slice(0, 560).replace(/\s\S*$/,'') + '…';
    /* cada esporte tem a sua unidade: km/h na bike, 100 m na piscina */
    const UN = {corrida:[' km','/km',''], bike:[' km',' km/h',''], natacao:[' m','/100m','']};
    const u = UN[p.esporte] || UN.corrida;
    const chips = (p.km || p.pace || p.tempo) ? '<div class="resumo">'
      + (p.km    ? '<span>' + esc(p.km) + u[0] + '</span>' : '')
      + (p.pace  ? '<span>' + esc(p.pace) + u[1] + '</span>' : '')
      + (p.tempo ? '<span>' + esc(p.tempo) + '</span>' : '')
      + '</div>' : '';
    return '<article id="p-' + p.id + '">'
      + '<div class="data">' + dataLonga(p.data) + '</div>'
      + '<h2>' + esc(tit) + '</h2>'
      + chips
      + embutir(p.video)
      + '<div class="midia" data-fotos="' + p.id + '"></div>'
      + '<div class="corpo">' + texto(mostra) + '</div>'
      + (longo ? '<button class="mais" data-id="' + p.id + '">'
                 + (aberto ? t.menos : t.mais) + '</button>' : '')
      + '</article>'
      + '<button class="mais" id="btVoltar">' + t.voltar + '</button>';
  }).join('');

  carregarFotos();

  ['btVoltar','btTopo'].forEach(function(id){
    const b = document.getElementById(id);
    if(b) b.onclick = aoInicio;
  });

  host.querySelectorAll('.mais').forEach(function(b){
    b.onclick = function(){
      const i = b.dataset.id;
      abertos.has(i) ? abertos.delete(i) : abertos.add(i);
      pintar();
    };
  });
}

document.querySelectorAll('.idioma button').forEach(function(b){
  b.onclick = function(){
    idioma = b.dataset.l;
    try{ localStorage.setItem('rwg.lang', idioma) }catch(e){}
    document.querySelectorAll('.idioma button').forEach(function(x){
      x.classList.toggle('on', x.dataset.l === idioma);
    });
    pintar();
  };
});
document.querySelectorAll('.idioma button').forEach(function(x){
  x.classList.toggle('on', x.dataset.l === idioma);
});

document.getElementById('lupa').onclick = function(){ this.classList.remove('on') };
document.getElementById('btMarca').onclick = function(e){ e.preventDefault(); aoInicio() };
document.getElementById('btMenu').onclick = function(){ abrirMenu(true) };
document.getElementById('mFecha').onclick = function(){ abrirMenu(false) };
document.getElementById('veu').onclick    = function(){ abrirMenu(false) };
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') abrirMenu(false) });

pintar();

/* o resumo de treino é público e só tem número: nada de sono,
   estresse, HRV ou onde a corrida passou */
fetch(DB + '/blog/evolucao.json')
  .then(function(r){ return r.ok ? r.json() : null })
  .then(function(d){ if(d && d.corrida){ EVO = d; pintarEvolucao() } })
  .catch(function(){});

/* os textos são públicos: leitura direta, sem login */
fetch(DB + '/blog/posts.json')
  .then(function(r){ return r.ok ? r.json() : null })
  .then(function(d){
    if(!d) return;
    POSTS = Object.keys(d).map(function(k){ return Object.assign({id:k}, d[k]) })
      .filter(function(p){ return p.publicado && p.data })
      .sort(function(a,b){ return a.data < b.data ? 1 : -1 });
    pintar();
  })
  .catch(function(){});
  </script>
