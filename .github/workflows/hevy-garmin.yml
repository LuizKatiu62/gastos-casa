name: Academia do dia para Garmin

# Quando voce ativa um dia de academia no app ("Vou a academia"), a
# lista daquele dia (YMCA ou Casa, com as trocas) vira um treino de
# forca no calendario do Garmin, naquela data: exercicio, series, reps,
# carga em libras e descanso. O app e quem escolhe o dia e o tipo (nada
# de perna antes do longao). Ver sync-hevy-garmin.py.
#
# Seguranca: so mexe em treino com a marca [forca:data] deste robo.
# Treino do coach humano nunca e alterado nem removido.
# Sem novidade no app, nem faz login no Garmin.

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min: ativou no app, logo esta no relogio
  workflow_dispatch:
    inputs:
      modo:
        description: 'ensaio = so mostra como fica · enviar = cria/atualiza no Garmin'
        required: true
        default: enviar
        type: choice
        options:
          - enviar
          - ensaio

permissions:
  contents: write

concurrency:
  group: hevy-garmin
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    if: github.repository == 'LuizKatiu62/gastos-casa'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install garminconnect

      - name: Academia ativada no app → treino de força no Garmin
        run: python sync-hevy-garmin.py
        env:
          GARMIN_PASSWORD:   ${{ secrets.GARMIN_PASSWORD }}
          FIREBASE_EMAIL:    ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || 'enviar' }}

      - name: Guardar o registro do que foi enviado
        if: always()
        run: |
          if [ -n "$(git status --porcelain treinos-v2/garmin-forca.json)" ]; then
            git config user.name  "hevy-garmin"
            git config user.email "hevy-garmin@users.noreply.github.com"
            git add treinos-v2/garmin-forca.json
            git commit -m "forca no Garmin: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3; do
              git pull --rebase -q && git push && break
              sleep 5
            done
          else
            echo "registro sem mudanca"
          fi
